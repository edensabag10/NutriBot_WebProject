<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriBot - התחברות</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap');
        body { font-family: 'Assistant', sans-serif; }
    </style>
</head>
<body class="bg-sky-50 flex items-center justify-center min-h-screen">
    <div class="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-md border border-sky-100 overflow-hidden relative">
        <div class="absolute -top-10 -left-10 text-9xl text-sky-50 opacity-50">🍃</div>
        
        <div class="text-center mb-8 relative z-10">
            <h1 class="text-4xl font-extrabold text-sky-600 mb-2 flex items-center justify-center gap-2">
                NutriBot <span class="text-sky-400">🍃</span>
            </h1>
            <p class="text-slate-500">הדרך שלך לתזונה מאוזנת מתחילה כאן</p>
        </div>
        
        <form class="space-y-6 relative z-10">
            <div>
                <label class="block text-slate-700 font-semibold mb-2">שם משתמש / אימייל</label>
                <input type="text" class="w-full px-5 py-3 rounded-full border border-slate-200 focus:ring-2 focus:ring-sky-400 outline-none transition bg-slate-50" placeholder="הקלידי שם משתמש">
            </div>
            <div>
                <label class="block text-slate-700 font-semibold mb-2">סיסמה</label>
                <input type="password" class="w-full px-5 py-3 rounded-full border border-slate-200 focus:ring-2 focus:ring-sky-400 outline-none transition bg-slate-50" placeholder="••••••••">
            </div>
            <button type="button" onclick="window.location.href='index.html'" class="w-full bg-sky-600 text-white font-bold py-3 rounded-full hover:bg-sky-500 shadow-lg transition duration-300 transform hover:scale-105">
                כניסה למערכת
            </button>
        </form>
        
        <div class="mt-8 text-center text-sm text-slate-500">
        עדיין אין לך חשבון? <a href="register.html" class="text-sky-600 font-bold hover:underline">הירשמ/י עכשיו</a>
        </div>
    </div>
</body>
</html>
